# Guárdalo en tu repositorio como:  .github/workflows/vigilar-citas-dgt.yml
# y sube también dgt_citas.py a la raíz del repositorio.
#
# Los avisos se configuran en Settings > Secrets and variables > Actions > New repository secret:
#   NTFY_TOPIC                                  (tema de ntfy.sh, p. ej. una cadena larga y aleatoria)
#   SMTP_HOST, SMTP_USER, SMTP_PASS, MAIL_TO    (opcionales, para recibir también correo)
# Los que no crees llegan vacíos y el script los ignora.

name: Vigilar citas DGT

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # rondas normales (sin latido)
    - cron: "2 * * * *"                  # ronda + latido (omitido de 02:00 a 06:00 en España)
  workflow_dispatch:                # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: vigilar-citas-dgt
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Comprobar oficinas (Sabadell y Barcelona)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LATIDO: ${{ github.event.schedule == '2 * * * *' && '--latido' || '' }}
        run: python dgt_citas.py --centro-id 546,545 $LATIDO
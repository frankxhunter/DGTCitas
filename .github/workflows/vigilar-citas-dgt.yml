name: Vigilar citas DGT

on:
  workflow_dispatch:
    inputs:
      probar_aviso:
        description: "Enviar solo un aviso de prueba"
        type: boolean
        default: false  # lo lanza cron-job.org por API (y tú a mano)

permissions:
  contents: read

concurrency:
  group: vigilar-citas-dgt
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Comprobar oficinas (Sabadell y Barcelona)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PROBAR: ${{ inputs.probar_aviso }}
        run: |
          if [ "$PROBAR" = "true" ]; then
            python dgt_citas.py --probar-aviso
            exit 0
          fi
          MIN=$(TZ=Europe/Madrid date +%-M)
          HOUR=$(TZ=Europe/Madrid date +%-H)
          LATIDO=""
          if [ "$MIN" -lt 10 ] && [ $((HOUR % 8)) -eq 0 ]; then LATIDO="--latido"; fi
          python dgt_citas.py --centro-id 546,545 $LATIDO